pipeline:
  name: z-image-turbo
  dtype: torch.bfloat16
  path: /home/tonera/SVDQuant/Beyond_Reality_v1/diffusers
develop_dtype: torch.bfloat16
collect:
  root: /home/tonera/project/devgdovgdeepc/datasets
  num_samples: 8
eval:
  num_steps: 4
  guidance_scale: 0
  protocol: fmeuler{num_steps}-g{guidance_scale}
  benchmarks:
    - "deepcompressor/dataset/MJHQ30KMETA.json"
  num_samples: 8
quant:
  enable_smooth: false
  calib:
    batch_size: 1
    path: datasets/{dtype}/{model}/{protocol}/{data}/s8
    num_samples: 8
    num_workers: 1
  wgts:
    enable_low_rank: true
    calib_range:
      element_batch_size: 4
      sample_batch_size: 4
      element_size: 4
      sample_size: 4
      outputs_device: cuda
    low_rank:
      sample_batch_size: 4
      sample_size: 4
      num_iters: 10
      outputs_device: cuda
      skips:
      - transformer_norm
      - transformer_add_norm
      - attn_add
      - ffn_add
  ipts:
    calib_range:
      element_batch_size: 4
      sample_batch_size: 4
      element_size: 4
      sample_size: 4
    skips: 
    - transformer_norm
    - transformer_add_norm
    - attn_add
    - ffn_add
  opts:
    calib_range:
      element_batch_size: 4
      sample_batch_size: 4
      element_size: 4
      sample_size: 4
  smooth:
    proj:
      allow_low_rank: false
      element_batch_size: 4
      sample_batch_size: 4
      element_size: 4
      sample_size: 4
      num_grids: 2
      skips:
      - transformer_norm
      - transformer_add_norm
      - attn_add
      - ffn_add
    attn:
      sample_batch_size: 4
      sample_size: 4
      num_grids: 2
